# Viditor static site for https://viditor.samuelgelacio.io
#
# Usage on the VPS (from the repo root):
#   cp deploy/.env.example deploy/.env   # adjust network / Traefik names if needed
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# The container publishes no ports to the internet. Your existing reverse proxy reaches it over the
# shared Docker network. See docs/deployment.md for Traefik and Caddy setups.

services:
  viditor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: viditor-web:latest
    container_name: viditor
    restart: unless-stopped
    networks:
      - proxy
    # If your reverse proxy runs on the host (not in Docker), expose on loopback only instead:
    # ports:
    #   - "127.0.0.1:${VIDITOR_LOCAL_PORT:-8088}:80"
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      # Traefik (ignored if you use Caddy)
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.viditor.rule=Host(`${VIDITOR_HOST:-viditor.samuelgelacio.io}`)
      - traefik.http.routers.viditor.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.viditor.tls=true
      - traefik.http.routers.viditor.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.viditor.loadbalancer.server.port=80

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
